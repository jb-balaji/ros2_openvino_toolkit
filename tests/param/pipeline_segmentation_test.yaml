Pipelines:
- name: segmentation
  inputs: [Video]
  input_path: <OPENVINO_TEST_DATA>/segmentation.mp4
  infers:
    - name: ObjectSegmentation
      model: <OPENVINO_NODE_SHARE>/models/intel/semantic-segmentation-adas-0001/FP16/semantic-segmentation-adas-0001.xml
      engine: CPU
      label: <OPENVINO_DATA>/labels/object_segmentation/frozen_inference_graph.labels
      batch: 1
      confidence_threshold: 0.5
      enable_roi_constraint: true # set enable_roi_constraint to false if you don't want to make the inferred ROI (region of interest) constrained into the camera frame
  outputs: [RosTopic]
  connects:
    - left: Video
      right: [ObjectSegmentation]
    - left: ObjectSegmentation
      right: [RosTopic]

OpenvinoCommon:

