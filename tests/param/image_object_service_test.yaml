Pipelines:
- name: object
  inputs: [Image]
  input_path: <OPENVINO_DATA>/images/car_1.bmp
  infers:
    - name: ObjectDetection
      model: <OPENVINO_NODE_SHARE>/models/intel/vehicle-license-plate-detection-barrier-0106/FP32/vehicle-license-plate-detection-barrier-0106.xml
      engine: CPU
      label: <OPENVINO_DATA>/labels/object_detection/vehicle-license-plate-detection-barrier-0106.labels
      batch: 1
      confidence_threshold: 0.5
      enable_roi_constraint: true # set enable_roi_constraint to false if you don't want to make the inferred ROI (region of interest) constrained into the camera frame
  outputs: [RosService]
  connects:
    - left: Image
      right: [ObjectDetection]
    - left: ObjectDetection
      right: [RosService]

Common:
