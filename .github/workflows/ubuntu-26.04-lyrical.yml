name: Ubuntu-26.04-Lyrical-CI

on:
  push:
    branches: [ "ros2_lyrical" ]
  pull_request:
    branches: [ "ros2_lyrical" ]
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ros:lyrical-ros-base

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: install dependencies
      run: |
        apt-get update
        apt-get install -y --no-install-recommends git python3-venv \
          python3-colcon-common-extensions build-essential cmake libopencv-dev \
          ros-lyrical-cv-bridge ros-lyrical-librealsense2 ros-lyrical-yaml-cpp-vendor

    - name: install openvino 2026.1
      run: |
        # https://docs.openvino.ai/2026/get-started/install-openvino/install-openvino-pip.html
        python3 -m venv ~/openvino_env
        ~/openvino_env/bin/pip install openvino

    - name: build ros2 openvino toolkit
      shell: bash
      run: |
        mkdir -p ~/ros2_ws/src
        cp -rf ${GITHUB_WORKSPACE} ~/ros2_ws/src/ros2_openvino_toolkit
        cd ~/ros2_ws/src
        git clone https://github.com/intel/ros2_object_msgs.git
        cd ~/ros2_ws
        source /opt/ros/lyrical/setup.bash
        # The pip package ships its CMake config; do not activate the venv while building.
        export OpenVINO_DIR=$(~/openvino_env/bin/python3 -c "import openvino, os; print(os.path.join(os.path.dirname(openvino.__file__), 'cmake'))")
        colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release
